<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Certificate</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2c3e50; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #27ae60; }
        .status-box { margin-top: 30px; padding: 20px; border-radius: 8px; display: none; font-size: 24px; font-weight: bold; }
        .status-VALID { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .status-TAMPERED { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .status-REVOKED { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
        .status-NOT_FOUND { background-color: #e2e3e5; color: #383d41; border: 2px solid #d6d8db; }
        
        .metadata { text-align: left; margin-top: 20px; font-size: 14px; color: #555; display: none; background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Blockchain Verification</h1>
        <p>Upload the digital certificate PDF to cryptographically verify its authenticity against the blockchain.</p>
        
        <form id="verifyForm">
            <div class="form-group">
                <label for="certificateId">Certificate ID</label>
                <input type="text" id="certificateId" required readonly>
            </div>
            <div class="form-group">
                <label for="pdf">Select Certificate PDF</label>
                <input type="file" id="pdf" accept="application/pdf" required>
            </div>
            <button type="submit">Verify Now</button>
        </form>

        <div id="statusBox" class="status-box"></div>
        <div id="metadataBox" class="metadata"></div>
    </div>

    <script>
        // Auto-fill ID from URL params if present
        const urlParams = new URLSearchParams(window.location.search);
        const urlId = urlParams.get('id');
        if (urlId) {
            document.getElementById('certificateId').value = urlId;
        } else {
            document.getElementById('certificateId').removeAttribute('readonly');
        }

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const certId = document.getElementById('certificateId').value;
            formData.append('certificateId', certId);
            formData.append('pdf', document.getElementById('pdf').files[0]);

            const submitBtn = e.target.querySelector('button');
            submitBtn.textContent = 'Verifying with Blockchain...';
            submitBtn.disabled = true;
            
            try {
                // 1. Verify Hash On-Chain
                const response = await fetch('/api/certificates/verify', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Verification failed');
                
                const statusBox = document.getElementById('statusBox');
                statusBox.textContent = `STATUS: ${data.status}`;
                statusBox.className = `status-box status-${data.status}`;
                statusBox.style.display = 'block';

                // 2. If Valid, fetch off-chain metadata
                if (data.status === 'VALID') {
                    const metaResponse = await fetch(`/api/certificates/${certId}`);
                    if (metaResponse.ok) {
                        const meta = await metaResponse.json();
                        const metaBox = document.getElementById('metadataBox');
                        metaBox.innerHTML = `
                            <strong>Student:</strong> ${meta.studentName}<br>
                            <strong>Course:</strong> ${meta.courseName}<br>
                            <strong>Issued:</strong> ${new Date(meta.issueDate).toLocaleString()}<br>
                            <strong>Institution:</strong> ${meta.institutionId}
                        `;
                        metaBox.style.display = 'block';
                    }
                } else {
                    document.getElementById('metadataBox').style.display = 'none';
                }

            } catch (error) {
                alert('Error verifying certificate: ' + error.message);
            } finally {
                submitBtn.textContent = 'Verify Now';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
